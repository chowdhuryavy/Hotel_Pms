<style>
  :root{
    --brand:#0f3d3e; --brand-2:#1d7874; --accent:#f2b134; --bg:#f4f7f6; --card:#ffffff;
    --text:#14232b; --muted:#66757d; --line:#dde5e3; --ok:#1b8a4b; --bad:#c0392b; --warn:#c77700;
    --c-res:#cfe8ff; --c-in:#c9f2d6; --c-dep:#e5e7eb; --c-ooo:#f6d6d2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0c1719; --card:#142327; --text:#e4eeec; --muted:#8fa6a3; --line:#27403f; --brand:#082628; --c-res:#1f3550; --c-in:#1d4a33; --c-dep:#2b3338; --c-ooo:#4a2622; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  .center{text-align:center}
  h1{font-size:22px;margin:0 0 14px}
  h1 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
  h3{margin:0 0 10px;font-size:15px}
  h4{margin:0 0 6px}

  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:linear-gradient(140deg,var(--brand),var(--brand-2))}
  .login-box{background:var(--card);padding:28px;border-radius:14px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .login-box h1{text-align:center;font-size:20px}
  .login-box label{display:block;margin-bottom:12px}
  #loginLogo img,#brandLogo img{max-height:44px;max-width:100%;display:block;margin:0 0 6px}

  .app{display:flex;min-height:100vh}
  .sidebar{width:240px;background:var(--brand);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  .brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  .brand-name{font-weight:700;font-size:16px}
  .brand-sub{font-size:12px;opacity:.75}
  .nav{overflow:auto;padding:8px 0;flex:1}
  .nav a{display:block;padding:9px 18px;color:#cfe3e1;cursor:pointer;border-left:3px solid transparent}
  .nav a:hover{background:rgba(255,255,255,.08)}
  .nav a.on{background:rgba(255,255,255,.14);border-left-color:var(--accent);color:#fff;font-weight:600}
  .nav .grp{padding:12px 18px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
  .bizbox{padding:12px 16px;background:rgba(0,0,0,.18);font-size:12px}
  .bizbox b{display:block;font-size:15px;color:var(--accent)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .menu-btn{display:none}
  .who{font-size:13px;color:var(--muted)}
  .view{padding:20px;max-width:1320px;width:100%}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi b{display:block;font-size:22px;margin-top:4px}
  .kpi span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:12px}
  .toolbar label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
  .btn{background:var(--brand-2);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.ghost.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
  .btn.danger{background:var(--bad)}
  .btn.ok{background:var(--ok)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.block{width:100%;padding:11px}
  .btn:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
  textarea{width:100%}
  label span{display:block;margin-bottom:4px;font-size:12px;color:var(--muted)}
  .fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .fgrid label{display:flex;flex-direction:column}
  .fgrid label.wide{grid-column:1/-1}
  .actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tbl{overflow:auto;border:1px solid var(--line);border-radius:10px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--bg);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.sum td{font-weight:700;background:var(--bg)}
  .lnk{color:var(--brand-2);cursor:pointer;font-weight:600;text-decoration:underline}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--line);white-space:nowrap}
  .pill.Reserved,.pill.Active,.pill.Inspected{background:#d6ecff;color:#1a4f86}
  .pill.In-House,.pill.Clean{background:#d3f5de;color:#14622f}
  .pill.Departed,.pill.Closed{background:#e5e7eb;color:#374151}
  .pill.Cancelled,.pill.No-Show,.pill.Out{background:#fde2de;color:#8a2016}
  .pill.Dirty,.pill.Pickup{background:#fdeab3;color:#6b4300}
  .pos{color:var(--ok);font-weight:700}
  .neg{color:var(--bad);font-weight:700}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px;margin:0}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;font-weight:600}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .err{color:var(--bad);font-size:13px;min-height:18px}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  .steps{display:flex;gap:8px;margin-bottom:12px;font-size:12px;color:var(--muted)}
  .rack{overflow:auto;border:1px solid var(--line);border-radius:10px}
  .rack table{width:auto;min-width:100%}
  .rack th,.rack td{padding:4px 6px;font-size:12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
  .rack th.dt{min-width:72px;text-align:center}
  .rack td.rm{position:sticky;left:0;background:var(--card);font-weight:700;z-index:1}
  .rack td.cell{background:var(--c-res);cursor:pointer;overflow:hidden;max-width:140px;text-overflow:ellipsis}
  .rack td.cell.In-House{background:var(--c-in)}
  .rack td.cell.ooo{background:var(--c-ooo)}
  .rack td.cell.blank.ooo{background:var(--c-ooo)}
  .rack td.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .room{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;border-top:4px solid var(--ok)}
  .room.dirty{border-top-color:var(--warn)}
  .room.occ{border-top-color:var(--brand-2)}
  .room.ooo{border-top-color:var(--bad);opacity:.8}
  .kpi-line{display:flex;gap:18px;flex-wrap:wrap}

  .modal{position:fixed;inset:0;background:rgba(5,15,18,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal-box{background:var(--card);border-radius:14px;width:100%;max-width:680px;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .modal-head h3{font-size:17px;margin:0}
  .x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--brand);color:#fff;padding:12px 18px;border-radius:10px;transition:transform .25s;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.bad{background:var(--bad)}

  @media (max-width:900px){
    .sidebar{position:fixed;left:-250px;z-index:40;transition:left .2s;height:100vh}
    body.menu-open .sidebar{left:0}
    .menu-btn{display:inline-block}
    .grid2{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .view{padding:16px}
    .fgrid{grid-template-columns:1fr}
  }
  /* 14-night occupancy forecast, shift bar, warnings */
  .fc{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
  .fc-col{min-width:46px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
  .fc-bar{width:26px;height:110px;background:var(--line);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
  .fc-bar i{display:block;width:100%;background:var(--brand-2)}
  .fc-col span{color:var(--muted)}
  .shiftbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .card.warn{border-left:4px solid var(--warn)}
  .card.warn li{margin:4px 0}
  /* ===== Loading screen ===== */
  .splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%,#1d7874 0%,#0f3d3e 55%,#0a2a2b 100%);color:#fff;
    transition:opacity .5s ease,visibility .5s;}
  .splash.gone{opacity:0;visibility:hidden;pointer-events:none;}
  .splash-inner{text-align:center;padding:24px;}
  .splash-logo{width:104px;height:104px;margin:0 auto 18px;animation:float 2.4s ease-in-out infinite,pop-in .7s cubic-bezier(.2,.8,.2,1) both;}
  .splash-logo svg{width:100%;height:100%;filter:drop-shadow(0 12px 26px rgba(0,0,0,.35));}
  .splash-name{font-size:28px;font-weight:700;letter-spacing:.5px;animation:rise .6s .15s ease both;}
  .splash-bar{width:200px;height:4px;margin:20px auto 12px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;}
  .splash-bar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,transparent,#f2b134,transparent);animation:slide 1.2s ease-in-out infinite;}
  .splash-msg{font-size:13px;opacity:.85;min-height:18px;animation:fade 1s ease infinite alternate;}
  .splash-ver{margin-top:22px;font-size:11px;opacity:.6;letter-spacing:1px;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pop-in{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
  @keyframes fade{from{opacity:.45}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

  /* ===== Icons, version and entrance animations ===== */
  .brand svg,.brand img{width:44px;height:44px;border-radius:12px;}
  .login-box svg,.login-box img{width:60px;height:60px;margin:0 auto 6px;display:block;}
  .ver{font-size:11px;opacity:.6;margin-top:12px;text-align:center;letter-spacing:.3px;}
  .view > *{animation:rise .38s ease both;}
  .modal-box{animation:pop .22s ease both;}

  /* ===== Hover and press feedback ===== */
  .btn{transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,61,62,.22);filter:brightness(1.06);}
  .btn:active{transform:translateY(0) scale(.98);box-shadow:none;}
  .nav a{transition:background .15s ease,padding-left .2s ease,color .15s ease;}
  .nav a:hover{background:rgba(255,255,255,.12);padding-left:18px;}
  .card{transition:box-shadow .2s ease,transform .2s ease;}
  .card:hover{box-shadow:0 8px 24px rgba(15,61,62,.10);}
  .kpi{transition:transform .2s ease,box-shadow .2s ease;}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,61,62,.14);}
  .tbl tbody tr{transition:background .12s ease;}
  .tbl tbody tr:hover{background:rgba(29,120,116,.08);}
  .lnk{cursor:pointer;transition:color .15s ease;}
  .lnk:hover{color:var(--brand-2);text-decoration:underline;}
  .pill{transition:transform .15s ease;}
  .pill:hover{transform:scale(1.06);}
  .fc-col:hover .fc-bar{box-shadow:0 0 0 2px var(--brand-2);}
  .fc-bar{transition:box-shadow .2s ease;}
  .fc-bar i{transition:height .6s ease;}
  .btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }
</style>
