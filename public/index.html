<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
  <link rel="icon" id="defIcon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%230f3d3e'/%3E%3Cpath d='M16 42V24l16-10 16 10v18' fill='none' stroke='%23f2b134' stroke-width='4' stroke-linejoin='round'/%3E%3Crect x='26' y='32' width='12' height='10' fill='%23f2b134'/%3E%3Cpath d='M12 42h40' stroke='%231d7874' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #0f3d3e; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycby7xsmwCZNBMgMet7dMtFrY5YdkU_ZC6_1NtWWrIG7Tn5KY6JcZOvm0yYo22xP_vICGeA/exec"
    title="Stayline" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script>
    // The app name comes from its Settings sheet, so nothing is typed in here
    function nameLoaded(d) {
      var n = d && d.appName;
      if (n) document.title = n;
      if (d && d.logoUrl) setIcon(d.logoUrl);
    }
    // The tab and home-screen icon: the logo from Settings, drawn to a PNG (phones need PNG). Keeps the default if it fails.
    function setIcon(src) {
      var setLink = function (rel, href, type) {
        var l = document.querySelector('link[rel="' + rel + '"]');
        if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
        l.href = href;
        if (type) l.type = type; else l.removeAttribute('type');
      };
      // The tab uses the logo itself, the same image as the sidebar
      var typeOf = /^data:image\/svg/i.test(src) ? 'image/svg+xml' : /^data:image\/png/i.test(src) ? 'image/png' : /^data:image\/jpe?g/i.test(src) ? 'image/jpeg' : /^data:image\/webp/i.test(src) ? 'image/webp' : '';
      setLink('icon', src, typeOf);
      var img = new Image();
      img.onload = function () {
        try {
          var c = document.createElement('canvas'); c.width = 192; c.height = 192;
          var x = c.getContext('2d');
          x.fillStyle = '#0f3d3e';
          x.beginPath(); if (x.roundRect) x.roundRect(0, 0, 192, 192, 36); else x.rect(0, 0, 192, 192); x.fill();
          x.drawImage(img, 28, 28, 136, 136);
          // Phones use this square PNG for the home-screen icon
          setLink('apple-touch-icon', c.toDataURL('image/png'), 'image/png');
        } catch (e) { /* the browser will not let the page draw it: the tab still uses the logo */ }
      };
      img.onerror = function () { /* the logo could not be loaded: keep the default icon */ };
      img.src = src;
    }
  </script>
  <script src="https://script.google.com/macros/s/AKfycby7xsmwCZNBMgMet7dMtFrY5YdkU_ZC6_1NtWWrIG7Tn5KY6JcZOvm0yYo22xP_vICGeA/exec?nameFor=nameLoaded"></script>
</body>
</html>
