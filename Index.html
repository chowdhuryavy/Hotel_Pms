<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="app-version" content="<?= appVersion ?>">
  <meta name="exec-url" content="<?= execUrl ?>">
  <title><?= appName ?></title>
  <link rel="icon" id="tabIcon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%230f3d3e'/%3E%3Cpath d='M16 42V24l16-10 16 10v18' fill='none' stroke='%23f2b134' stroke-width='4' stroke-linejoin='round'/%3E%3Crect x='26' y='32' width='12' height='10' fill='%23f2b134'/%3E%3Cpath d='M12 42h40' stroke='%231d7874' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%230f3d3e'/%3E%3Cpath d='M16 42V24l16-10 16 10v18' fill='none' stroke='%23f2b134' stroke-width='4' stroke-linejoin='round'/%3E%3Crect x='26' y='32' width='12' height='10' fill='%23f2b134'/%3E%3Cpath d='M12 42h40' stroke='%231d7874' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <?!= include('Styles'); ?>
</head>
<body>

  <!-- LOADING SCREEN (hidden by the app once it has started) -->
  <div id="splash" class="splash gone">
    <div class="splash-inner">
      <div class="splash-logo" id="splashLogo"></div>
      <div class="splash-name"><?= appName ?></div>
      <div class="splash-bar"><i></i></div>
      <div class="splash-msg" id="splashMsg">Preparing your hotel…</div>
      <div class="splash-ver">v<?= appVersion ?></div>
    </div>
  </div>

  <!-- SIGN IN -->
  <div id="login" class="login hidden">
    <aside class="login-art" aria-hidden="true">
      <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
      <div class="art-inner">
        <h2 class="art-title">Every stay, in one place.</h2>
        <p class="art-text">Reservations, front desk, housekeeping, billing and night audit, run from one secure system.</p>
        <p class="art-foot">Secure sign-in · Role-based access · Full audit trail</p>
      </div>
    </aside>
    <div class="login-panel">
      <form class="login-box" onsubmit="doLogin(event)">
        <div class="login-head">
          <div id="loginLogo" class="login-logo" aria-hidden="true"></div>
          <h1 id="loginTitle"><?= appName ?></h1>
          <p class="muted" id="loginHotel"></p>
        </div>
        <h2 class="login-welcome">Welcome back</h2>
        <p class="muted" style="margin:0 0 22px;font-size:13.5px">Sign in with your staff account.</p>
        <label class="field"><span>Email or username</span>
          <span class="inp"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg><input name="u" autocomplete="username" required autofocus></span></label>
        <label class="field"><span>Password</span>
          <span class="pw">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input name="p" id="loginPw" type="password" autocomplete="current-password" required onkeyup="capsCheck(event)" onkeydown="capsCheck(event)">
            <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg></button>
          </span></label>
        <div class="login-foot"><button type="button" class="linkbtn" onclick="forgotOpen(this.form.u.value)">Forgot password?</button></div>
        <p class="caps hidden" id="capsWarn">Caps Lock is on.</p>
        <p class="err" id="loginErr" role="alert"></p>
        <button class="btn login-btn" type="submit"><span class="btn-label">Sign in</span><span class="spinner" aria-hidden="true"></span></button>
      </form>
      <div class="ver rights">© <?= new Date().getFullYear() ?> <?= appName ?>. All rights reserved. · v<?= appVersion ?></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div id="brandLogo" role="button" tabindex="0" title="Show menu" aria-label="Show menu" onclick="toggleSidebar()" onkeydown="if(event.key==='Enter')toggleSidebar()"></div>
        <div class="brand-txt">
          <div class="brand-name" id="brandName"></div>
          <div class="brand-sub" id="brandHotel"></div>
        </div>
        <button type="button" class="sb-close" onclick="toggleSidebar()" aria-label="Close menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="account" id="account"></div>
      <div class="ver"><?= appName ?> v<?= appVersion ?></div>
      <div class="licbox" id="licbox"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="logo-btn" id="sbToggle" onclick="toggleSidebar()" title="Show or hide menu" aria-label="Toggle sidebar" aria-expanded="true"><span id="sbLogo"></span></button>
        <div class="who" id="who"></div>
        <div class="bell-wrap">
          <button class="bell-btn" id="bellBtn" onclick="toggleBell_(event)" title="Notifications" aria-label="Notifications" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bell-n" id="bellN" hidden></span></button>
          <div class="bell-panel" id="bellPanel" hidden></div>
        </div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Switch theme" aria-label="Switch theme"></button>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head"><h3 id="mTitle"></h3><button class="x" onclick="closeModal()">&times;</button></div>
      <div id="mBody"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script>setTimeout(function () { var s = document.getElementById('splash'); if (s) s.classList.add('gone'); }, 12000);</script>

  <script>
<?!= include('App') ?>
  </script>
</body>
</html>
